# Phase 2 minimal bring-up: just the database. Phase 8 adds backend/frontend.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ps
      POSTGRES_PASSWORD: ps
      POSTGRES_DB: partselect
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps -d partselect"]
      interval: 5s
      retries: 10
volumes:
  pgdata: {}
