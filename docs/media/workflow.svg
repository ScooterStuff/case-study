<svg viewBox="0 0 1600 1010" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#337778"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F4364C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA6A5"/>
    </marker>
  </defs>
  <rect width="1600" height="1010" fill="#FFFFFF"/>
  <text x="60" y="52" font-size="30" font-weight="bold" fill="#121212">One chat turn — runtime workflow</text>
  <text x="60" y="82" font-size="17" fill="#555453">POST /chat → guarded, tool-grounded, validated, streamed over SSE</text>

  <!-- user message -->
  <rect x="60" y="120" width="300" height="110" rx="10" fill="#337778"/>
  <text x="210" y="155" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">User message</text>
  <text x="210" y="182" font-size="14" fill="#DCEAE9" text-anchor="middle">"Is this part compatible with</text>
  <text x="210" y="202" font-size="14" fill="#DCEAE9" text-anchor="middle">my WDT780SAEM1 model?"</text>
  <line x1="360" y1="175" x2="438" y2="175" stroke="#337778" stroke-width="3" marker-end="url(#arr)"/>

  <!-- guard -->
  <rect x="445" y="120" width="340" height="110" rx="10" fill="#F6F6F4" stroke="#337778" stroke-width="2"/>
  <text x="615" y="152" font-size="19" font-weight="bold" fill="#121212" text-anchor="middle">Scope guard</text>
  <text x="615" y="178" font-size="14" fill="#555453" text-anchor="middle">1. regex fast-path — zero extra LLM calls</text>
  <text x="615" y="200" font-size="14" fill="#555453" text-anchor="middle">2. tiny classifier only when ambiguous</text>

  <!-- deflect branch -->
  <line x1="785" y1="175" x2="888" y2="175" stroke="#9AA6A5" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrG)"/>
  <text x="836" y="160" font-size="13" fill="#777" text-anchor="middle">out-of-scope /</text>
  <text x="836" y="220" font-size="13" fill="#777" text-anchor="middle">injection</text>
  <rect x="895" y="120" width="330" height="110" rx="10" fill="#F6F6F4" stroke="#D7D7D7" stroke-width="2"/>
  <text x="1060" y="152" font-size="18" font-weight="bold" fill="#121212" text-anchor="middle">Friendly deflection</text>
  <text x="1060" y="178" font-size="14" fill="#555453" text-anchor="middle">on-brand, varied templates;</text>
  <text x="1060" y="200" font-size="14" fill="#555453" text-anchor="middle">no tools, no leak — done in ~10 ms</text>
  <path d="M 1225 175 L 1260 175 L 1260 905" fill="none" stroke="#9AA6A5" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrG)"/>

  <!-- arrow guard -> loop -->
  <line x1="615" y1="230" x2="615" y2="293" stroke="#337778" stroke-width="3" marker-end="url(#arr)"/>
  <text x="630" y="270" font-size="14" fill="#337778" font-weight="bold">in_scope</text>

  <!-- agent loop container -->
  <rect x="60" y="300" width="1180" height="350" rx="14" fill="#FFFFFF" stroke="#337778" stroke-width="2.5"/>
  <rect x="60" y="300" width="1180" height="46" rx="14" fill="#337778"/>
  <text x="650" y="330" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Agent loop — one LLM, max 4 tool rounds</text>

  <rect x="110" y="390" width="270" height="130" rx="10" fill="#337778"/>
  <text x="245" y="428" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LLM</text>
  <text x="245" y="455" font-size="14" fill="#DCEAE9" text-anchor="middle">OpenAI-compatible (3 env vars)</text>
  <text x="245" y="477" font-size="14" fill="#DCEAE9" text-anchor="middle">or scripted MOCK_LLM</text>
  <text x="245" y="499" font-size="14" fill="#DCEAE9" text-anchor="middle">sees 6 typed tool schemas</text>

  <line x1="380" y1="455" x2="463" y2="455" stroke="#337778" stroke-width="3" marker-end="url(#arr)"/>
  <polygon points="555,395 670,455 555,515 440,455" fill="#F6F6F4" stroke="#337778" stroke-width="2"/>
  <text x="555" y="448" font-size="15" font-weight="bold" fill="#121212" text-anchor="middle">tool</text>
  <text x="555" y="470" font-size="15" font-weight="bold" fill="#121212" text-anchor="middle">calls?</text>

  <line x1="670" y1="455" x2="753" y2="455" stroke="#337778" stroke-width="3" marker-end="url(#arr)"/>
  <text x="711" y="440" font-size="14" fill="#337778" font-weight="bold">yes</text>
  <rect x="760" y="390" width="210" height="130" rx="10" fill="#F6F6F4" stroke="#337778" stroke-width="2"/>
  <text x="865" y="425" font-size="17" font-weight="bold" fill="#121212" text-anchor="middle">Run tools</text>
  <text x="865" y="450" font-size="14" fill="#555453" text-anchor="middle">in parallel (asyncio)</text>
  <text x="865" y="472" font-size="14" fill="#555453" text-anchor="middle">errors → tool_error,</text>
  <text x="865" y="494" font-size="14" fill="#555453" text-anchor="middle">never a 500</text>

  <line x1="970" y1="455" x2="1043" y2="455" stroke="#337778" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="1050" y="390" width="160" height="130" rx="10" fill="#F6F6F4" stroke="#337778" stroke-width="2"/>
  <text x="1130" y="430" font-size="15" font-weight="bold" fill="#121212" text-anchor="middle">Append results</text>
  <text x="1130" y="455" font-size="13" fill="#555453" text-anchor="middle">compacted JSON;</text>
  <text x="1130" y="476" font-size="13" fill="#555453" text-anchor="middle">collect allowed</text>
  <text x="1130" y="497" font-size="13" fill="#555453" text-anchor="middle">PS numbers</text>
  <path d="M 1130 390 L 1130 370 L 245 370 L 245 388" fill="none" stroke="#337778" stroke-width="2.5" stroke-dasharray="2 0" marker-end="url(#arr)"/>
  <text x="688" y="363" font-size="13" fill="#555453" text-anchor="middle">loop (≤ 4 rounds)</text>

  <!-- events to SSE -->
  <path d="M 865 520 L 865 905" fill="none" stroke="#9AA6A5" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrG)"/>
  <text x="880" y="580" font-size="13" fill="#777">tool_start · ui_block · tool_end (live)</text>

  <!-- no -> validator -->
  <path d="M 555 515 L 555 723" fill="none" stroke="#337778" stroke-width="3" marker-end="url(#arr)"/>
  <text x="572" y="690" font-size="14" fill="#337778" font-weight="bold">no → final draft (buffered)</text>

  <!-- validator -->
  <rect x="380" y="730" width="350" height="120" rx="10" fill="#FFFFFF" stroke="#F4364C" stroke-width="3"/>
  <text x="555" y="765" font-size="18" font-weight="bold" fill="#F4364C" text-anchor="middle">Hallucination gate</text>
  <text x="555" y="792" font-size="14" fill="#555453" text-anchor="middle">every PS# in the draft must appear</text>
  <text x="555" y="814" font-size="14" fill="#555453" text-anchor="middle">in this conversation's tool results</text>

  <!-- fail loop -->
  <path d="M 380 790 L 300 790" fill="none" stroke="#F4364C" stroke-width="3" marker-end="url(#arrR)"/>
  <rect x="60" y="730" width="240" height="120" rx="10" fill="#FDECEE" stroke="#F4364C" stroke-width="2"/>
  <text x="180" y="763" font-size="15" font-weight="bold" fill="#B3293A" text-anchor="middle">fail → retry with nudge</text>
  <text x="180" y="788" font-size="14" fill="#B3293A" text-anchor="middle">still failing → strip number,</text>
  <text x="180" y="810" font-size="14" fill="#B3293A" text-anchor="middle">add caveat, log to</text>
  <text x="180" y="832" font-size="14" fill="#B3293A" text-anchor="middle">hallucination_log.jsonl</text>

  <!-- pass -> tokens -->
  <line x1="730" y1="790" x2="893" y2="790" stroke="#337778" stroke-width="3" marker-end="url(#arr)"/>
  <text x="810" y="775" font-size="14" fill="#337778" font-weight="bold">pass</text>
  <rect x="900" y="730" width="240" height="120" rx="10" fill="#337778"/>
  <text x="1020" y="775" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stream tokens</text>
  <text x="1020" y="802" font-size="14" fill="#DCEAE9" text-anchor="middle">then done {latency_ms}</text>
  <path d="M 1020 850 L 1020 905" fill="none" stroke="#9AA6A5" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrG)"/>

  <!-- SSE bar -->
  <rect x="60" y="910" width="1480" height="60" rx="10" fill="#121212"/>
  <text x="85" y="947" font-size="16" font-weight="bold" fill="#F3C04C">SSE stream to the browser:</text>
  <text x="320" y="947" font-size="16" fill="#FFFFFF">tool_start → ui_block (rich component) → tool_end → token × n → done — pills and blocks render live; prose held ~100 ms for the gate</text>

  <!-- legend -->
  <rect x="1280" y="320" width="260" height="190" rx="10" fill="#F6F6F4" stroke="#D7D7D7"/>
  <text x="1300" y="350" font-size="15" font-weight="bold" fill="#121212">Legend</text>
  <rect x="1300" y="368" width="26" height="16" fill="#337778" rx="3"/><text x="1336" y="381" font-size="13" fill="#555453">LLM / streaming step</text>
  <rect x="1300" y="394" width="26" height="16" fill="#F6F6F4" stroke="#337778" rx="3"/><text x="1336" y="407" font-size="13" fill="#555453">deterministic code</text>
  <rect x="1300" y="420" width="26" height="16" fill="#FFFFFF" stroke="#F4364C" stroke-width="2" rx="3"/><text x="1336" y="433" font-size="13" fill="#555453">safety rail</text>
  <line x1="1300" y1="456" x2="1326" y2="456" stroke="#9AA6A5" stroke-width="3" stroke-dasharray="7 5"/><text x="1336" y="461" font-size="13" fill="#555453">SSE events</text>
  <text x="1300" y="492" font-size="12" fill="#777">guard fast-path: time-to-first</text>
  <text x="1300" y="508" font-size="12" fill="#777">event &lt; 1.5 s (tested)</text>
</svg>
