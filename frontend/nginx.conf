# Serves the CRA build and proxies API routes to the backend container -
# no CORS needed in container mode.
server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(chat|parts|health|docs|openapi.json) {
    proxy_pass http://backend:8000;
    proxy_buffering off;            # SSE: stream tokens immediately
    proxy_set_header Connection '';
    proxy_http_version 1.1;
  }

  location / {
    try_files $uri /index.html;
  }
}
